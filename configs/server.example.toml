# SiegaNet server config.
domain     = "example.com"            # certificate / SNI domain
listen_tcp = ":443"                   # HTTP/1.1 + HTTP/2 (decoy + ACME challenge)
listen_udp = ":443"                   # HTTP/3 over QUIC (decoy + WebTransport tunnel)

# Certificate source: "acme" (Let's Encrypt, TLS-ALPN-01) | "file" | "localca" (dev).
cert_mode      = "acme"
acme_cache_dir = "./acme-cache"
acme_email     = "you@example.com"
# cert_file    = "./fullchain.pem"    # used when cert_mode = "file"
# key_file     = "./privkey.pem"

# ---- added in later Phase 1 steps ----
