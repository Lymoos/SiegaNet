# SiegaNet server config.
domain     = "example.com"            # certificate / SNI domain
listen_tcp = ":443"                   # HTTP/1.1 + HTTP/2 (decoy + ACME challenge)
listen_udp = ":443"                   # HTTP/3 over QUIC (decoy + WebTransport tunnel)

# Certificate source: "acme" (Let's Encrypt, TLS-ALPN-01) | "file" | "localca" (dev).
cert_mode      = "acme"
acme_cache_dir = "./acme-cache"
acme_email     = "you@example.com"
# cert_file    = "./fullchain.pem"    # used when cert_mode = "file"
# key_file     = "./privkey.pem"

# Decoy: "static" serves the embedded (or decoy_dir) site directly; "proxy"
# transparently reverse-proxies to decoy_target.
decoy_mode   = "static"
# decoy_dir  = "./site"
# decoy_target = "https://example-upstream"

# Tunnel / peers.
tunnel_path        = "/wt/CHANGE_ME"  # magic WebTransport path (keep secret)
inner_subnet       = "10.7.0.0/24"
server_inner_ip    = "10.7.0.1"
dns                = "1.1.1.1"        # DNS handed to clients
peers_store        = "./peers.toml"
pad_min            = 0
pad_max            = 256
obfusc             = false            # Salamander-XOR (Phase 4)
allow_inter_client = true             # client<->client routing
